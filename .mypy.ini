[mypy]
exclude = (?x)(
    ^tests/runselftest.py$
    | Documents/manual-source/conf.py
    | examples/embedexample.py
    | setup.py
    | install_data.py
    | pyqt_setuptools.py
  )

# Disable certain errors by filename (without the .py) or by folder (with *)
[mypy-veusz/widgets.*]
disable_error_code = import-not-found, attr-defined

[mypy-veusz/utils.*]
disable_error_code = import-not-found, import-untyped

[mypy-veusz/utils.vzdbus]
disable_error_code = import-not-found, no-redef

[mypy-veusz/utils.fitlm]
disable_error_code = import-untyped, no-redef

[mypy-veusz/utils.textrender]
disable_error_code = import-not-found, attr-defined

[mypy-veusz/setting.controls]
disable_error_code = assignment, var-annotated

[mypy-veusz/setting.setting]
disable_error_code = assignment, attr-defined

[mypy-veusz/setting.stylesheet]
disable_error_code = var-annotated

[mypy-veusz/document.emf_export]
disable_error_code = import-not-found

[mypy-veusz/document.painthelper]
disable_error_code = import-not-found

[mypy-veusz/document.doc]
disable_error_code = import-untyped

[mypy-veusz/document.commandinterface]
disable_error_code = var-annotated

[mypy-veusz/document.loader]
disable_error_code = import-untyped

[mypy-veusz/dialogs.veuszdialog]
disable_error_code = var-annotated

[mypy-veusz/dialogs.exceptiondialog]
disable_error_code = var-annotated

[mypy-veusz.plugins.votable]
disable_error_code = import-untyped

[mypy-veusz.dataimport.dialog_fits]
disable_error_code = import-untyped, import-not-found

[mypy-veusz.dataimport.dialog_hdf5]
disable_error_code = import-untyped

[mypy-veusz.dataimport.defn_csv]
disable_error_code = dict-item

[mypy-veusz.dataimport.defn_fits]
disable_error_code = import-not-found, import-untyped

[mypy-veusz.dataimport.fits_hdf5_helpers]
disable_error_code = import-untyped

[mypy-veusz.dataimport.defn_hdf5]
disable_error_code = import-untyped

[mypy-veusz.datasets.plugin]
disable_error_code = override

[mypy-veusz.qtall]
disable_error_code = no-redef, import-not-found

[mypy-veusz.windows.mainwindow]
disable_error_code = import-untyped, var-annotated

